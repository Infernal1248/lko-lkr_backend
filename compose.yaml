services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: cards
      DB_USERNAME: cards
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PDFTOPPM_BINARY: /usr/bin/pdftoppm
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    build: .
    restart: unless-stopped
    command: ['php','artisan','schedule:work']
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: cards
      DB_USERNAME: cards
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PDFTOPPM_BINARY: /usr/bin/pdftoppm
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./public:/var/www/html/public:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cards
      POSTGRES_USER: cards
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U cards -d cards']
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres:
  storage:
